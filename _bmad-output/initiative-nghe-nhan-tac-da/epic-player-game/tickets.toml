[[entry]]
id = 1
type = "story"
title = "Split player flow into screen components"
description = "Splits web/src/main.tsx into per-screen components (start, notebook, carve, music, medal, result, avatar) with no behaviour change, so later stories touch separate files."
verify = "Build passes and a manual journey on local dev matches the current behaviour screen for screen."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Test harness and tracer journey"
description = "Adds Vitest and Playwright (390x844 viewport) and one journey test: sign in, answer Q1, reload, resume at Q2, against staging."
verify = "The Playwright journey passes in CI against staging."
covers = ["FR-08", "FR-09"]
after = [1, "1.4", "1.9"]
hitl = true
risk = "medium"
unknown = "How Playwright signs in on staging, since Google sign-in is mandatory (test user via Supabase admin-created session?)."

[[entry]]
id = 3
type = "story"
title = "Save state indicator and safe resend"
description = "Adds Đang lưu / Đã lưu / Chưa lưu states for answers, offline detection and an idempotent resend, and owns the client error mapper for the RPC error-code contract that story 8 reuses."
verify = "Playwright with network offline shows Chưa lưu, resends on reconnect, and the server holds exactly one answer."
covers = ["FR-15", "FR-09", "CAP-2", "CAP-3"]
after = [2, "1.1", "1.6"]
hitl = false
risk = "medium"

